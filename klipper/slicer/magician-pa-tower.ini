# Pressure advance tuning tower (Klipper docs/Pressure_Advance.md), from magician-pla-cube.ini.
# 100 mm/s walls, 0.2 mm layers (0.3 would be ~13.5 mm3/s, too much for the stock hotend), 215 C, accel 500, SCV 1.
# PA = 0 + height_mm * 0.020 (bowden). After the print: set pressure_advance in [extruder] and RESTART.
#   prusa-slicer --export-gcode --load magician-pa-tower.ini --center 0,0 ~/klipper/docs/prints/square_tower.stl -o pa_tower.gcode
bed_shape = -50x-50,50x-50,50x50,-50x50
max_print_height = 140
nozzle_diameter = 0.4
filament_diameter = 1.75
extrusion_multiplier = 1
gcode_flavor = klipper
use_relative_e_distances = 0
use_firmware_retraction = 0
gcode_comments = 1
gcode_label_objects = 0
binary_gcode = 0
extrusion_width = 0.4
first_layer_extrusion_width = 0.4
perimeter_extrusion_width = 0.4
external_perimeter_extrusion_width = 0.4
infill_extrusion_width = 0.4
solid_infill_extrusion_width = 0.4
top_infill_extrusion_width = 0.4
layer_height = 0.2
first_layer_height = 0.3
perimeters = 1
top_solid_layers = 0
bottom_solid_layers = 2
fill_density = 0%
fill_pattern = grid
skirts = 1
skirt_distance = 3
skirt_height = 1
min_skirt_length = 0
brim_width = 0
support_material = 0
temperature = 215
first_layer_temperature = 215
bed_temperature = 0
first_layer_bed_temperature = 0
perimeter_speed = 100
external_perimeter_speed = 100
small_perimeter_speed = 100
infill_speed = 100
solid_infill_speed = 60
top_solid_infill_speed = 60
bridge_speed = 30
first_layer_speed = 15
travel_speed = 60
retract_length = 6.5
retract_speed = 25
retract_lift = 0
retract_before_travel = 2
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 0
full_fan_speed_layer = 0
slowdown_below_layer_time = 0
min_print_speed = 10
start_gcode = G21\nG90\nM82\nG28\nM104 S[first_layer_temperature]\nM109 S[first_layer_temperature]\nSET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=1 ACCEL=500\nTUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START=0 FACTOR=.020\nG92 E0\nG1 Z5 F1500
end_gcode = M104 S0\nG91\nG1 E-3 F1800\nG1 Z20 F1200\nG90\nG1 X0 Y0 F3000\nM84
seam_position = aligned
avoid_crossing_perimeters = 0
