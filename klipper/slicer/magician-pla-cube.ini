# PrusaSlicer 2.7 profile for the BIQU Magician on Klipper, matching the Smoothieware/Cura reference cube
# (models/calibration-cube/README.md). Slice with:
#   prusa-slicer --export-gcode --load magician-pla-cube.ini --center 0,0 cube.stl -o cube.gcode
bed_shape = -50x-50,50x-50,50x50,-50x50
max_print_height = 140
nozzle_diameter = 0.4
filament_diameter = 1.75
extrusion_multiplier = 1
gcode_flavor = klipper
use_relative_e_distances = 0
use_firmware_retraction = 0
gcode_comments = 1
gcode_label_objects = 0
binary_gcode = 0
extrusion_width = 0.4
first_layer_extrusion_width = 0.4
perimeter_extrusion_width = 0.4
external_perimeter_extrusion_width = 0.4
infill_extrusion_width = 0.4
solid_infill_extrusion_width = 0.4
top_infill_extrusion_width = 0.4
layer_height = 0.2
first_layer_height = 0.3
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 4
fill_density = 20%
fill_pattern = grid
skirts = 2
skirt_distance = 3
skirt_height = 1
min_skirt_length = 0
brim_width = 0
support_material = 0
temperature = 205
first_layer_temperature = 215
bed_temperature = 0
first_layer_bed_temperature = 0
perimeter_speed = 15
external_perimeter_speed = 15
small_perimeter_speed = 15
infill_speed = 30
solid_infill_speed = 30
top_solid_infill_speed = 30
bridge_speed = 15
first_layer_speed = 15
travel_speed = 60
retract_length = 6.5
retract_speed = 25
retract_lift = 0
retract_before_travel = 2
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 0
full_fan_speed_layer = 0
slowdown_below_layer_time = 10
min_print_speed = 10
start_gcode = G21\nG90\nM82\nG28\nM104 S[first_layer_temperature]\nM109 S[first_layer_temperature]\nG92 E0\nG1 Z5 F1500
end_gcode = M104 S0\nG91\nG1 E-3 F1800\nG1 Z20 F1200\nG90\nG1 X0 Y0 F3000\nM84
