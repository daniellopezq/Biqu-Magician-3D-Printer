# BIQU Magician (BQ111-A6, LPC1768) - Klipper config
# Pins from the stock Smoothieware config-get dump (docs/stock-firmware-dump.md).
# GUESS = polarity/value inferred from Smoothie syntax; verify with the listed test.
#
# Firmware build: LPC1768 100 MHz, no bootloader, serial UART0 P0.3/P0.2 @ 250000,
# CONFIG_INITIAL_PINS="!P2.7,P2.4" (heater off + fans on from power-up, before the host connects).

[mcu]
serial: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
baud: 250000

[printer]
kinematics: delta
max_velocity: 100          # stock limit was 120 mm/s; start lower
max_accel: 1500            # stock 3000; start lower
max_z_velocity: 50
#delta_radius: 61.7         # stock M665 R
print_radius: 66           # raised from 45 for the 120 mm glass probe test; reach limit is ~83 mm (arm horizontal)
minimum_z_position: -5     # allows going a little below Z0 for paper tests (was -80 during the first probe)

# Steppers: drivers are soldered on; microstepping assumed 16 (100 steps/mm stock
# => rotation_distance = 200*16/100 = 32 mm, i.e. a 16-tooth GT2 pulley).
[stepper_a]                # front-left tower (Smoothie alpha / X)
step_pin: P2.0
dir_pin: P0.5              # VERIFIED with FORCE_MOVE +2 = up (!P0.5 went down)
enable_pin: !P0.4          # VERIFIED (motor moves)
microsteps: 16             # GUESS - check: 10 mm commanded = 10 mm moved
rotation_distance: 32
endstop_pin: ^P1.25        # VERIFIED with QUERY_ENDSTOPS (open at rest, triggered when pressed)
homing_speed: 20           # slow for the first homes; raise to 40-50 later
homing_retract_dist: 5
#arm_length: 146.03         # stock M665 L
# Deliberately LOW so the first moves stop above the bed. Real value (stock
# Z150 minus the 3 mm bed, minus trims) comes from DELTA_CALIBRATE.
#position_endstop: 135

[stepper_b]                # front-right tower (Smoothie beta / Y)
step_pin: P2.1
dir_pin: P0.11             # VERIFIED with FORCE_MOVE +2 = up
enable_pin: !P0.10         # VERIFIED
microsteps: 16
rotation_distance: 32
endstop_pin: ^P1.27        # VERIFIED

[stepper_c]                # back tower (Smoothie gamma / Z)
step_pin: P2.2
dir_pin: P0.20             # VERIFIED with FORCE_MOVE +2 = up
enable_pin: !P0.19         # VERIFIED
microsteps: 16
rotation_distance: 32
endstop_pin: ^P1.29        # VERIFIED

[extruder]
step_pin: P2.3
dir_pin: P0.22             # VERIFIED: !P0.22 fed backwards on FORCE_MOVE +5
enable_pin: !P0.21         # VERIFIED (extruder moves)
microsteps: 16
rotation_distance: 7.901   # 200*16/405; VERIFIED 2026-11-23: 40 mm commanded = 40 mm fed
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: P2.7
sensor_type: EPCOS 100K B57560G104F   # Smoothie "EPCOS100K"
sensor_pin: P0.24
control: pid
pid_Kp: 22.2               # stock Smoothie values as a starting point;
pid_Ki: 1.08               # run PID_CALIBRATE HEATER=extruder TARGET=210
pid_Kd: 114                # once the heatsink fan is confirmed
min_temp: 0
max_temp: 250              # PLA only, unheated bed
min_extrude_temp: 170
max_extrude_only_distance: 100

# FAN WARNING: all three fans, including the heatsink fan above the nozzle, are on
# the one switched output P2.4. It must be a heater_fan so it can't be turned off
# while the hotend is hot. There is no separate print-cooling fan; while the hotend
# is above 50 C every fan runs at 100%.
[heater_fan heatsink_fan]
pin: P2.4
heater: extruder
heater_temp: 50.0
fan_speed: 1.0
shutdown_speed: 1.0        # fans on if Klipper shuts down

# Slicers send M106/M107. With no [fan] section they'd error, and a real [fan] on
# P2.4 would let them switch the heatsink fan off. These make them harmless.
[gcode_macro M106]
gcode:
  RESPOND MSG="M106 ignored: fans are tied to the heatsink fan (heater_fan)"

[gcode_macro M107]
gcode:
  RESPOND MSG="M107 ignored: fans are tied to the heatsink fan (heater_fan)"

[force_move]
enable_force_move: True    # for FORCE_MOVE direction checks

[delta_calibrate]
radius: 45                 # probe circle; nozzle reaches about r=55 at the far points
horizontal_move_z: 25       # must be >= probe z_offset (13)
speed: 40

# Probe on the plug by the nozzle block (P1.28). Enable once the switch is fitted.
# Wired C+NC (recommended): closed at rest = low, opens when pressed = high
#   => pin: ^P1.28        (a broken wire also reads high = "triggered": fail-safe)
# Wired C+NO: open at rest = high, closes when pressed = low
#   => pin: ^!P1.28       (this is what stock Smoothie used: 1.28!^)
# Check with QUERY_PROBE (open/triggered) before any probing move.
[probe]
pin: ^P1.28                # SS0505A wired C (brown, GND) + NC (red). VERIFY with QUERY_PROBE:
                           # at rest must say "open", pressed must say "TRIGGERED".
x_offset: 0                # roller is 10 mm toward tower C (back) of the nozzle, measured 2026-11-23 with the dot test
y_offset: 10               # was -10 before the probe was remounted facing the other way
z_offset: 13.15            # paper test 2026-11-23: roller hangs 13.15 mm below the nozzle (the 9-10 mm ruler estimate was low)
speed: 5
samples: 2
sample_retract_dist: 3

[virtual_sdcard]
path: /home/movies/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[include mainsail.cfg]

